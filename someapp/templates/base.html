<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курсы</title>
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            background-color: #3f4069;
            color: #333;
            margin: 0;
            padding: 0;
        }
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* Шапка */
        header {
            background-color: #00124e;
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: #ecf0f1;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        header a:hover {
            color: #3498db;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        
        /* Кнопки */
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #2980b9; }

        /* Сетка карточек */
        .courses-grid {
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            margin-top: 20px;
            justify-content: flex-start;
        }

        /* Карточка */
        .course-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            width: 260px; /* Фиксированная ширина */
            background: #fff;
            box-sizing: border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Анимация карточки */
        .course-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }

        /* Картинка */
        .course-image {
            width: 100%;
            height: 150px;
            object-fit: cover; /* Обрезает картинку, чтобы она не растягивалась */
            border-radius: 4px;
            margin-bottom: 10px;
            transition: transform 0.4s ease;
        }

        /* Анимация картинки */
        .course-card:hover .course-image {
            transform: scale(1.05);
        }

        /* Заглушка, если нет фото */
        .no-image {
            width: 100%;
            height: 150px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <a href="{% url 'main' %}">Главная</a>
        </div>
        <div class="user-info">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Личный кабинет</a>
                <a href="{% url 'create_request' %}">Оставить заявку</a>
                <span>Привет, {{ user.username }}!</span>
                <form action="{% url 'logout' %}" method="post" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit" style="padding: 4px 10px; font-size: 12px;">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
