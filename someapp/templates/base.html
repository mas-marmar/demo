<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курсы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #b9a6c4; 
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #450452; 
            padding: 15px 20px;
            color: white;
        }
        header a {
            color: #ecf0f1;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }
        header a:hover {
            color: #3498db; 
        }
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button, input[type="submit"] {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover, input[type="submit"]:hover {
            background-color: #2980b9;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'main' %}">Главная</a>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Личный кабинет</a>
            <a href="{% url 'create_request' %}">Оставить заявку</a>
            <span style="float: right;">
                Привет, {{ user.username }}! 
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="padding: 2px 8px; font-size: 12px;">Выйти</button>
                </form>
            </span>
        {% else %}
            <span style="float: right;">
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            </span>
        {% endif %}
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
